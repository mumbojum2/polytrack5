<!doctype html>
<html>

<head>
    <base href="https://cdn.jsdelivr.net/gh/mumbojum2/polytrack5@polytrack-0.6.3-known-launcher-fix/">
    <script>
        window.jkdfgnjkndfg = document.querySelector('base').href;
        window.polytrackModConfiguration = Object.assign({}, window.polytrackModConfiguration, { unblocked: true });
        fetch("simulation_worker.bundle.js").then(res => res.text()).then(text => {
            text = text.replace(
                'importScripts("lib/polytrack_physics.js")',
                'self.fetch = ((originalFetch) => (input, init) => { if (input === "polytrack_physics.wasm") input = self.jkdfgnjkndfg + "polytrack_physics.wasm"; return originalFetch(input, init); })(self.fetch); self.jkdfgnjkndfg = "' + window.jkdfgnjkndfg + '"; importScripts("' + window.jkdfgnjkndfg + 'lib/polytrack_physics.js")'
            );
            const blob = new Blob([text.replaceAll("replacethisplease", window.jkdfgnjkndfg)], {
                type: 'application/javascript'
            });
            window.simulationworker = URL.createObjectURL(blob);
        });
        const ogworker = window.Worker;
        window.Worker = function (scripturl, options) {
            if (typeof scripturl === 'string' && scripturl.toLowerCase() === "simulation_worker.bundle.js") {
                scripturl = window.simulationworker;
            }
            return new ogworker(scripturl, options);
        };
        window.Worker.prototype = ogworker.prototype;

        const proxyKodubUrl = url => {
            if (!/^(?:https?:\/\/)?vps\.kodub\.com(?::43273)?(?:\/|$)/.test(url)) return url;
            const target = /^https?:\/\//.test(url) ? url : `https://${url}`;
            return `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`;
        };
        const ogfetch = window.fetch;
        window.fetch = async function (input, init) {
            if (typeof input === "string") {
                input = proxyKodubUrl(input);
            } else if (input instanceof Request) {
                const newUrl = proxyKodubUrl(input.url);
                input = new Request(newUrl, input);
            }
            return ogfetch(input, init);
        };

        const ogxml = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url, ...rest) {
            if (typeof url === "string") {
                url = proxyKodubUrl(url);
            }
            return ogxml.call(this, method, url, ...rest);
        };
    </script>
    <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
</head>

<body>
    <canvas id="screen"></canvas>
    <div id="ui"></div>
    <div id="transition-layer"></div>

    <script type="module" src="main.bundle.js" defer></script>
</body>

</html>
